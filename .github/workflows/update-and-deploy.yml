name: Collect, validate and deploy Pages

on:
  schedule:
    - cron: "17 6 * * *" # 09:17 Europe/Moscow; execution can be delayed by GitHub.
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: price-monitor-pages
  cancel-in-progress: false

jobs:
  collect-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Commit only public data; history persists on main.
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Offline adapter and state tests
        run: python -m pytest -q
      - name: Frontend logic tests
        run: npm test
      - name: Collect official prices independently
        run: python -u -m monitor.collect
      - name: Validate generated contract and report coverage
        run: python -m monitor.audit --summary
      - name: Persist history before publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/evidence data/sources.json public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official prices and preserve history"
            git push origin HEAD:main
          fi
      - name: Build static site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: collect-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the same run's artifact
        id: deployment
        uses: actions/deploy-pages@v4
