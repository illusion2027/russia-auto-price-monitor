name: Import verified MVP source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: initial-mvp-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack tracked project files
        env:
          EXPECTED_SHA256: 24cad43c557d32dc9d5fa90c3c394e1d1dd5fe09c07fcea02ebb19f6a73fa64f
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'source-import.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA256'], 'Archive checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              files = [i for i in z.infolist() if not i.is_dir()]
              assert len(files) == 61, 'Unexpected project file count'
              for info in files:
                  path = pathlib.PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  target = (root / str(path)).resolve()
                  assert target.is_relative_to(root), 'Unsafe archive path'
                  # Workflow files are installed via the authorized GitHub UI,
                  # not generated or modified using GITHUB_TOKEN.
                  if str(path).startswith('.github/workflows/'):
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          archive.unlink()
          print('Imported 59 project files. Install the 2 deployment/CI workflows from the verified source separately.')
          PY
      - name: Commit the imported source and remove temporary archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "feat: import complete Russia Auto Price Monitor MVP source"
            git push origin HEAD:main
          fi
